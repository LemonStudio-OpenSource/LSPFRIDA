name: Build LSPFRIDA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRIDA_VERSION: '17.9.3'
  NDK_VERSION: '28.2.13676358'     # 必须与 build.gradle.kts 里的 ndkVersion 一致
  BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: '36'
  CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不再使用 android-actions/setup-android@v3（会在 cmdline-tools 16.0 下尝试装 'tools' 而失败）
      - name: Configure Android SDK (use preinstalled)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT"     >> $GITHUB_ENV

          # 找到可用的 sdkmanager（优先 cmdline-tools/latest，其次 PATH）
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV

      - name: Install NDK / build-tools / CMake / platform
        run: |
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "ndk;${NDK_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          ls -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          ls -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"
          ls -d "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}" || true

      - name: Cache Frida GumJS devkit
        id: cache-frida
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/frida-gumjs-devkit
          key: frida-gumjs-devkit-${{ env.FRIDA_VERSION }}-android-arm64

      - name: Download Frida GumJS devkit
        if: steps.cache-frida.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/cpp/frida-gumjs-devkit/arm64-v8a
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz"
          echo "Downloading $URL"
          wget --tries=3 --timeout=120 -q "$URL" -O /tmp/gumjs.tar.xz
          tar -xf /tmp/gumjs.tar.xz -C app/src/main/cpp/frida-gumjs-devkit/arm64-v8a
          rm -f /tmp/gumjs.tar.xz
          ls -la app/src/main/cpp/frida-gumjs-devkit/arm64-v8a

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Prepare artifact name
        id: meta
        run: echo "suffix=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LSPFRIDA-${{ steps.meta.outputs.suffix }}
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
