name: Build LSPFRIDA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，避免 devkit 331MB 重复下载
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRIDA_VERSION: '17.9.3'
  NDK_VERSION: '28.2.13676358'   # 若 build.gradle.kts 的 ndkVersion 不同，改这里
  BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: '36'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK / build-tools / CMake
        run: |
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Cache Frida GumJS devkit
        id: cache-frida
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/frida-gumjs-devkit
          key: frida-gumjs-devkit-${{ env.FRIDA_VERSION }}-android-arm64

      - name: Download Frida GumJS devkit
        if: steps.cache-frida.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/cpp/frida-gumjs-devkit/arm64-v8a
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz"
          echo "Downloading $URL"
          wget --tries=3 --timeout=60 -q "$URL" -O /tmp/gumjs.tar.xz
          tar -xf /tmp/gumjs.tar.xz -C app/src/main/cpp/frida-gumjs-devkit/arm64-v8a
          rm -f /tmp/gumjs.tar.xz
          ls -la app/src/main/cpp/frida-gumjs-devkit/arm64-v8a

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Prepare artifact name
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "suffix=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LSPFRIDA-${{ steps.meta.outputs.suffix }}
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      # 打 tag 时自动发 Release（Release APK 未签名，仅作分发用，需要签名请自备 keystore）
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
